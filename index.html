<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>홈트 시간표</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;600;800&display=swap">
<style>
:root{
  --bg:#f6f5f1; --surface:#ffffff; --surface2:#efede7; --line:#e2dfd7;
  --ink:#1f2328; --muted:#6c6f73; --faint:#9a9c9f;
  --accent:#d9572b; --accent-ink:#ffffff; --accent-soft:#fbe7de;
  --ok:#2f7d4f;
  --fig:#1f2328; --fig-back:#a3a6aa; --fig-prop:#b58a52; --fig-floor:#d9d6ce; --db:#4b4f55;
  --radius:14px; --f:'Gothic A1',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16181a; --surface:#1f2225; --surface2:#2a2d31; --line:#33373c;
    --ink:#ecebe7; --muted:#a3a5a8; --faint:#75787c;
    --accent:#f07a4a; --accent-ink:#1a0d07; --accent-soft:#3a2219;
    --ok:#6cc08f;
    --fig:#ecebe7; --fig-back:#6d7176; --fig-prop:#c9a06a; --fig-floor:#3a3e43; --db:#b9bcc0;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#16181a; --surface:#1f2225; --surface2:#2a2d31; --line:#33373c;
  --ink:#ecebe7; --muted:#a3a5a8; --faint:#75787c;
  --accent:#f07a4a; --accent-ink:#1a0d07; --accent-soft:#3a2219;
  --ok:#6cc08f;
  --fig:#ecebe7; --fig-back:#6d7176; --fig-prop:#c9a06a; --fig-floor:#3a3e43; --db:#b9bcc0;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select{font:inherit;color:inherit}
.app{max-width:560px;margin:0 auto;padding-block:16px calc(84px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}
.brand{font-weight:800;font-size:19px;letter-spacing:-.02em}
.brand span{color:var(--accent)}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.iconbtn svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:1.8}
h2{font-size:22px;letter-spacing:-.02em;margin:4px 0 2px}
h3{font-size:15px;margin:18px 0 8px}
.muted{color:var(--muted)} .small{font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.row{display:flex;align-items:center;gap:8px}
.grow{flex:1;min-width:0}
.btn{border:none;border-radius:12px;padding:12px 16px;background:var(--surface2);font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.big{width:100%;padding:16px;font-size:17px}
.btn.ghost{background:none;border:1px solid var(--line)}
.btn.danger{background:none;color:#c0392b;border:1px solid var(--line)}
.btn:disabled{opacity:.45}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.empty{text-align:center;padding:28px 12px;color:var(--muted)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:10}
nav.tabs .in{display:flex;width:100%;max-width:560px}
nav.tabs button{flex:1;border:none;background:none;padding:10px 0 9px;font-size:12px;color:var(--faint);display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
nav.tabs button.on{color:var(--accent);font-weight:600}
section[data-tab]{display:none} section[data-tab].on{display:block}

/* 졸라맨 */
.fig{width:100%;height:auto;display:block}
.fig-body,.fig-back{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-width:6}
.fig-body{stroke:var(--fig)} .fig-body circle{fill:var(--fig);stroke:none}
.fig-back{stroke:var(--fig-back)}
.fig-floor{stroke:var(--fig-floor);stroke-width:2}
.fig-mat{fill:var(--fig-floor)}
.fig-wall{stroke:var(--fig-prop);stroke-width:4}
.fig-chair line{stroke:var(--fig-prop);stroke-width:4;stroke-linecap:round}
.fig-db line{stroke:var(--db);stroke-width:3;stroke-linecap:round} .fig-db .plate{stroke-width:6}
.fig-breath{text-align:center;font-size:14px;font-weight:600;color:var(--accent);min-height:21px}
.fig-card{aspect-ratio:200/184;display:grid;place-items:center;font-size:40px;font-weight:800;color:var(--faint);background:var(--surface2);border-radius:10px}

/* 오늘 */
.today-date{color:var(--muted);font-size:14px}
.routine li{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.routine li:last-child{border-bottom:none}
.routine{list-style:none;margin:6px 0 12px;padding:0}
.week{display:flex;justify-content:space-between;margin-top:10px}
.week .d{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--muted);flex:1}
.week .dot{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
.week .dot.done{background:var(--accent);border-color:var(--accent)}
.week .dot.today{border-color:var(--ink)}
.week .dot.done.today{border-color:var(--ink)}
.stats{display:flex;gap:10px;margin-top:12px}
.stat{flex:1;background:var(--surface2);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:22px;letter-spacing:-.02em}
.note{background:var(--accent-soft);border-radius:10px;padding:8px 12px;font-size:14px;margin:8px 0 0}

/* 시간표 */
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:12px}
.days button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;gap:2px}
.days button small{font-size:11px;color:var(--faint)}
.days button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.days button.on small{color:var(--bg);opacity:.7}
.days button.today{box-shadow:inset 0 -3px 0 var(--accent)}
.noteinput{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.items{list-style:none;margin:0 0 10px;padding:0;display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 8px 8px 8px}
.item .thumb{width:54px;flex:none}
.item .nm{font-weight:600}
.item .ctl{display:flex;gap:2px}
.item .ctl button{width:34px;height:34px;border:none;background:none;border-radius:8px;color:var(--muted)}
.item .ctl button:disabled{opacity:.25}
.addbtn{width:100%;border:1.5px dashed var(--line);background:none;border-radius:12px;padding:12px;color:var(--muted);font-weight:600}

/* 도감 */
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 14px;margin-bottom:10px}
.filters{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px;text-align:left;display:flex;flex-direction:column;gap:4px;position:relative}
.ex .nm{font-weight:600;font-size:14px;line-height:1.3}
.ex .meta{font-size:12px;color:var(--muted)}
.ex .star{position:absolute;top:6px;right:8px;color:var(--accent);font-size:14px}
.pickbar{position:sticky;top:0;z-index:5;background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:10px 12px;margin-bottom:10px;display:flex;align-items:center;gap:8px;font-weight:600}
.pickbar button{border:none;background:rgba(255,255,255,.25);color:inherit;border-radius:8px;padding:6px 10px}
.lvl{letter-spacing:1px}

/* 기록 */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .w{font-size:12px;color:var(--faint);padding:4px 0}
.cal button{border:none;background:none;border-radius:10px;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:14px}
.cal button .pt{width:6px;height:6px;border-radius:50%;background:transparent}
.cal button.has .pt{background:var(--accent)}
.cal button.today{font-weight:800;color:var(--accent)}
.cal button.sel{background:var(--surface2)}
.cal button:disabled{opacity:.25}
.sess{margin-top:10px}
.sess .ex-line{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}

/* 시트 */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:14px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 10px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.sheet-head h2{margin:0;font-size:20px}
.close{border:none;background:var(--surface2);border-radius:10px;width:36px;height:36px;font-size:18px}
.detail-fig{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 8px 6px;max-width:340px;margin:0 auto}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.tag{font-size:12px;background:var(--surface2);border-radius:999px;padding:3px 10px}
ol.steps{padding-left:20px;margin:6px 0}
ol.steps li{margin:4px 0}
ul.dots{padding-left:18px;margin:6px 0}
.stepper{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.stepper .ctl{display:flex;align-items:center;gap:8px}
.stepper .ctl button{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:18px}
.stepper .ctl input{width:64px;text-align:center;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 4px;font-weight:600}
.toggle{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}
.switch{width:50px;height:30px;border-radius:999px;border:none;background:var(--line);position:relative}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
.switch.on{background:var(--accent)} .switch.on::after{left:23px}
.actions{display:flex;gap:8px;margin-top:14px}
.actions .btn{flex:1}
textarea,.field{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;margin:4px 0 10px}
.seg{display:flex;background:var(--surface2);border-radius:10px;padding:3px;gap:3px;margin:4px 0 10px}
.seg button{flex:1;border:none;background:none;border-radius:8px;padding:8px}
.seg button.on{background:var(--surface);font-weight:600}

/* 운동 모드 */
.run{position:fixed;inset:0;background:var(--bg);z-index:40;display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.run-in{max-width:520px;width:100%;margin:0 auto;display:flex;flex-direction:column;flex:1;min-height:0}
.run-top{display:flex;align-items:center;gap:10px}
.bar{flex:1;height:6px;background:var(--surface2);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.run-body{flex:1;display:flex;flex-direction:column;justify-content:center;gap:10px;min-height:0;overflow:auto}
.run .fig-wrap{max-width:320px;width:100%;margin:0 auto}
.run h2{text-align:center;margin:0;font-size:24px}
.target{text-align:center;font-size:18px;font-weight:600}
.last{text-align:center;color:var(--muted);font-size:14px}
.adjust{display:flex;justify-content:center;gap:18px}
.adjust .one{display:flex;flex-direction:column;align-items:center;gap:4px}
.adjust .one .ctl{display:flex;align-items:center;gap:6px}
.adjust .one button{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:18px}
.adjust .one b{min-width:44px;text-align:center;font-size:20px}
.big-num{text-align:center;font-size:72px;font-weight:800;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.run-nav{display:flex;justify-content:space-between;margin-top:8px}
.run-nav button{border:none;background:none;color:var(--muted);padding:8px}
.next-prev{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.next-prev .thumb{width:64px;flex:none}
.sum li{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
.sum{list-style:none;padding:0;margin:8px 0}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;max-width:90vw;text-align:center}
@media (min-width:520px){ .grid{grid-template-columns:repeat(3,1fr)} }
</style>

html{-webkit-text-size-adjust:100%}

.install{background:var(--surface);border:1.5px dashed var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:14px;margin-bottom:14px}

<script>
(function () {
'use strict';
/* ---------- 기본 도구 ---------- */
const $ = s => document.querySelector(s);
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'text') e.textContent = v;
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) e.append(c.nodeType ? c : String(c));
  return e;
}
const clear = e => { while (e.firstChild) e.removeChild(e.firstChild); return e; };
const DAYS = Logic.DAYS;
const DAY_KO = { mon: '월', tue: '화', wed: '수', thu: '목', fri: '금', sat: '토', sun: '일' };
const LV = ['', '쉬움', '보통', '어려움'];
const todayYmd = () => Logic.ymd(new Date());

let S = Logic.loadState(Logic.readStorage());
let warned = false;
function save() {
  if (!Logic.saveState(S) && !warned) { warned = true; toast('이 브라우저에서는 기록이 저장되지 않아요. 앱을 닫으면 사라질 수 있어요.'); }
}
let toastTimer = 0;
function toast(msg) {
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = h('div', { class: 'toast', role: 'status', text: msg });
  document.body.append(t);
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), 3200);
}

/* ---------- 운동 찾기 ---------- */
const BYID = {};
for (const e of EXERCISES) BYID[e.id] = e;
function lookup(id) {

    h('button', { class: 'close', 'aria-label': run.phase === 'done' ? '닫기' : '끝내기', onclick: run.phase === 'done' ? closeRun : askEnd, text: '×' }),
    h('div', { class: 'bar', role: 'progressbar', 'aria-valuemin': 0, 'aria-valuemax': total, 'aria-valuenow': done }, h('i', { style: 'width:' + Math.min(100, done / total * 100) + '%' })),

      h('div', { class: 'big-num', id: 'restNum', text: fmt(Logic.restRemaining(run, Date.now())) }),
      h('div', { class: 'actions', style: 'justify-content:center' },
        h('button', { class: 'btn ghost', onclick: () => { run = Logic.addRest(run, 15); persist(); drawRun(); }, text: '+15초' }),
        h('button', { class: 'btn primary', onclick: endRest, text: '건너뛰기' })));
    const thumb = h('div', { class: 'thumb' });
    body.append(h('div', { class: 'next-prev' }, thumb, h('div', {}, h('div', { class: 'small muted', text: '다음' }), h('b', { text: it.name }), h('div', { class: 'small', text: run.set + ' / ' + it.sets + '세트 · ' + target(it) }))));

      if (!adj || adj.key !== run.i + ':' + run.set) adj = { key: run.i + ':' + run.set, reps: it.reps, kg: it.kg || 0 };
      const one = (label, key, step) => {
        const val = h('b', { text: adj[key] });

          h('button', { 'aria-label': label + ' 줄이기', onclick: () => set(adj[key] - step), text: '−' }), val,

      };

      body.append(h('button', { class: 'btn primary big', onclick: () => doneSet(adj.kg ? { reps: adj.reps, kg: adj.kg } : { reps: adj.reps }), text: '세트 완료' }));

    h('button', { disabled: run.i === 0, onclick: () => { run = Logic.prevExercise(run); clearTimer(); persist(); drawRun(); }, text: '‹ 이전 운동' }),

}
const target = it => (it.type === 'time' ? it.sec + '초' : it.reps + '회') + (it.kg ? ' · ' + it.kg + 'kg' : '');
const fmt = s => s >= 60 ? Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0') : String(s);
function clearTimer() { if (run) { run.timerEndAt = 0; run.countIn = 0; } }
function drawTimer(body, it) {
  const now = Date.now();

    const left = Math.max(0, Math.ceil((run.timerEndAt - now) / 1000));

    body.append(h('div', { class: 'big-num', id: 'timeNum', text: pre ? Math.ceil((run.countIn - now) / 1000) : fmt(left) }));
    body.append(h('button', { class: 'btn ghost big', onclick: () => { const done = Math.max(0, it.sec - Math.ceil((run.timerEndAt - Date.now()) / 1000)); clearTimer(); doneSet({ sec: Math.min(it.sec, done) }); }, text: '여기까지 하고 끝내기' }));
  } else {
    body.append(h('div', { class: 'big-num', text: fmt(it.sec) }));

function onTick() {

  } else if (run.phase === 'work' && run.timerEndAt) {
    const it = cur();
    const n = document.getElementById('timeNum');
    if (run.countIn && now < run.countIn) { if (n) n.textContent = Math.ceil((run.countIn - now) / 1000); return; }
    const left = Math.max(0, Math.ceil((run.timerEndAt - now) / 1000));

}

    body.append(h('p', { class: 'muted', text: any ? '지금까지 한 세트만 기록돼요.' : '아직 완료한 세트가 없어요.' }));

function drawSummary(body) {

    h('div', { class: 'stat' }, h('span', { class: 'small muted', text: '시간' }), h('b', { text: min + '분' })),
    h('div', { class: 'stat' }, h('span', { class: 'small muted', text: '완료 세트' }), h('b', { text: sets + '세트' })),
    h('div', { class: 'stat' }, h('span', { class: 'small muted', text: '이번 주' }), h('b', { text: Logic.weekCount(S.sessions, todayYmd()) + '회' }))));

    addEventListener("appinstalled", close);
  }
  if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
})();
</script>
