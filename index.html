<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HOME-T</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;600;800&display=swap">
<style>
:root{
  --bg:#f6f5f1; --surface:#ffffff; --surface2:#efede7; --line:#e2dfd7;
  --ink:#1f2328; --muted:#6c6f73; --faint:#9a9c9f;
  --accent:#d9572b; --accent-ink:#ffffff; --accent-soft:#fbe7de;
  --ok:#2f7d4f;
  --fig:#1f2328; --fig-back:#a3a6aa; --fig-prop:#b58a52; --fig-floor:#d9d6ce; --db:#4b4f55;
  --radius:14px; --f:'Gothic A1',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16181a; --surface:#1f2225; --surface2:#2a2d31; --line:#33373c;
    --ink:#ecebe7; --muted:#a3a5a8; --faint:#75787c;
    --accent:#f07a4a; --accent-ink:#1a0d07; --accent-soft:#3a2219;
    --ok:#6cc08f;
    --fig:#ecebe7; --fig-back:#6d7176; --fig-prop:#c9a06a; --fig-floor:#3a3e43; --db:#b9bcc0;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#16181a; --surface:#1f2225; --surface2:#2a2d31; --line:#33373c;
  --ink:#ecebe7; --muted:#a3a5a8; --faint:#75787c;
  --accent:#f07a4a; --accent-ink:#1a0d07; --accent-soft:#3a2219;
  --ok:#6cc08f;
  --fig:#ecebe7; --fig-back:#6d7176; --fig-prop:#c9a06a; --fig-floor:#3a3e43; --db:#b9bcc0;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select{font:inherit;color:inherit}
.app{max-width:560px;margin:0 auto;padding-block:16px calc(84px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}
.brand{font-weight:800;font-size:19px;letter-spacing:-.02em}
.brand span{color:var(--accent)}
.brand{letter-spacing:.01em;display:flex;align-items:baseline;gap:0}
.brand .tmark{width:1.12em;height:1em;fill:var(--accent);align-self:center;margin-left:1px;transform:translateY(-.02em)}
.brand .tmark .knuckle{fill:none;stroke:var(--bg);stroke-width:.8;stroke-linecap:round}
.brand small{font-size:12px;font-weight:600;color:var(--muted);margin-left:10px;letter-spacing:0}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.iconbtn svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:1.8}
h2{font-size:22px;letter-spacing:-.02em;margin:4px 0 2px}
h3{font-size:15px;margin:18px 0 8px}
.muted{color:var(--muted)} .small{font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.row{display:flex;align-items:center;gap:8px}
.grow{flex:1;min-width:0}
.btn{border:none;border-radius:12px;padding:12px 16px;background:var(--surface2);font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.big{width:100%;padding:16px;font-size:17px}
.btn.ghost{background:none;border:1px solid var(--line)}
.btn.danger{background:none;color:#c0392b;border:1px solid var(--line)}
.btn:disabled{opacity:.45}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.empty{text-align:center;padding:28px 12px;color:var(--muted)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:10}
nav.tabs .in{display:flex;width:100%;max-width:560px}
nav.tabs button{flex:1;border:none;background:none;padding:10px 0 9px;font-size:12px;color:var(--faint);display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
nav.tabs button.on{color:var(--accent);font-weight:600}
section[data-tab]{display:none} section[data-tab].on{display:block}

/* 졸라맨 */
.fig{width:100%;height:auto;display:block}
.fig-body,.fig-back{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-width:6}
.fig-body{stroke:var(--fig)} .fig-body circle{fill:var(--fig);stroke:none}
.fig-back{stroke:var(--fig-back)}
.fig-floor{stroke:var(--fig-floor);stroke-width:2}
.fig-mat{fill:var(--fig-floor)}
.fig-wall{stroke:var(--fig-prop);stroke-width:4}
.fig-chair line{stroke:var(--fig-prop);stroke-width:4;stroke-linecap:round}
.fig-db line{stroke:var(--db);stroke-width:3;stroke-linecap:round} .fig-db .plate{stroke-width:6}
.fig-breath{text-align:center;font-size:14px;font-weight:600;color:var(--accent);min-height:21px}
.fig-card{aspect-ratio:200/184;display:grid;place-items:center;font-size:40px;font-weight:800;color:var(--faint);background:var(--surface2);border-radius:10px}

/* 오늘 */
.today-date{color:var(--muted);font-size:14px}
.routine li{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.routine li:last-child{border-bottom:none}
.routine{list-style:none;margin:6px 0 12px;padding:0}
.week{display:flex;justify-content:space-between;margin-top:10px}
.week .d{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--muted);flex:1}
.week .dot{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
.week .dot.done{background:var(--accent);border-color:var(--accent)}
.week .dot.today{border-color:var(--ink)}
.week .dot.done.today{border-color:var(--ink)}
.stats{display:flex;gap:10px;margin-top:12px}
.stat{flex:1;background:var(--surface2);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:22px;letter-spacing:-.02em}
.note{background:var(--accent-soft);border-radius:10px;padding:8px 12px;font-size:14px;margin:8px 0 0}

/* 시간표 */
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:12px}
.days button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;gap:2px}
.days button small{font-size:11px;color:var(--faint)}
.days button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.days button.on small{color:var(--bg);opacity:.7}
.days button.today{box-shadow:inset 0 -3px 0 var(--accent)}
.noteinput{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.items{list-style:none;margin:0 0 10px;padding:0;display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 8px 8px 8px}
.item .thumb{width:54px;flex:none}
.item .nm{font-weight:600}
.item .ctl{display:flex;gap:2px}
.item .ctl button{width:34px;height:34px;border:none;background:none;border-radius:8px;color:var(--muted)}
.item .ctl button:disabled{opacity:.25}
.planbtn{width:100%;border:none;border-radius:12px;padding:13px;background:var(--accent-soft);color:var(--accent);font-weight:700;margin-bottom:12px}
.q{margin:12px 0 4px;font-weight:600;font-size:14px}
.qchips{display:flex;flex-wrap:wrap;gap:6px}
.qchips .chip{font-size:14px;padding:7px 12px}
.pday{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.pday ul{list-style:none;margin:6px 0 0;padding:0}
.pday li{display:flex;justify-content:space-between;gap:8px;font-size:14px;padding:3px 0}
.addbtn{width:100%;border:1.5px dashed var(--line);background:none;border-radius:12px;padding:12px;color:var(--muted);font-weight:600}

/* 도감 */
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 14px;margin-bottom:10px}
.filters{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px;text-align:left;display:flex;flex-direction:column;gap:4px;position:relative}
.ex .nm{font-weight:600;font-size:14px;line-height:1.3}
.ex .meta{font-size:12px;color:var(--muted)}
.ex .star{position:absolute;top:6px;right:8px;color:var(--accent);font-size:14px}
.pickbar{position:sticky;top:0;z-index:5;background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:10px 12px;margin-bottom:10px;display:flex;align-items:center;gap:8px;font-weight:600}
.pickbar button{border:none;background:rgba(255,255,255,.25);color:inherit;border-radius:8px;padding:6px 10px}
.lvl{letter-spacing:1px}

/* 기록 */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .tick{fill:var(--muted);font-size:10px;font-family:var(--f)}
.chart .bar{fill:var(--fig-back)}
.chart .bar.met{fill:var(--accent)}
.chart .goal{stroke:var(--ink);stroke-width:1.5;stroke-dasharray:4 4;opacity:.6}
.chart .goal-t{fill:var(--ink)}
.chart .line{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .pt{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.chart .pt.best{fill:var(--ink)}
.chart .best-t{fill:var(--ink);font-weight:700}
.chart .hit{fill:transparent;cursor:pointer;outline:none}
.chart .hit:focus-visible{stroke:var(--accent);stroke-width:1.5}
.readout{min-height:20px;font-size:13px;font-weight:600;text-align:center;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.chart-host{margin:0 -4px}
.tbl{margin-top:8px}
.tbl .ex-line{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.tbl .ex-line:last-child{border-bottom:none}
.tbl .ex-line .grow{text-align:left}
.xbtn{border:none;background:none;color:var(--muted);width:30px;height:30px}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .w{font-size:12px;color:var(--faint);padding:4px 0}
.cal button{border:none;background:none;border-radius:10px;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:14px}
.cal button .pt{width:6px;height:6px;border-radius:50%;background:transparent}
.cal button.has .pt{background:var(--accent)}
.cal button.today{font-weight:800;color:var(--accent)}
.cal button.sel{background:var(--surface2)}
.cal button:disabled{opacity:.25}
.sess{margin-top:10px}
.sess .ex-line{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}

/* 시트 */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:14px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 10px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.sheet-head h2{margin:0;font-size:20px}
.close{border:none;background:var(--surface2);border-radius:10px;width:36px;height:36px;font-size:18px}
.detail-fig{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 8px 6px;max-width:340px;margin:0 auto}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.tag{font-size:12px;background:var(--surface2);border-radius:999px;padding:3px 10px}
ol.steps{padding-left:20px;margin:6px 0}
ol.steps li{margin:4px 0}
ul.dots{padding-left:18px;margin:6px 0}
.stepper{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.stepper .ctl{display:flex;align-items:center;gap:8px}
.stepper .ctl button{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:18px}
.stepper .ctl input{width:64px;text-align:center;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 4px;font-weight:600}
.toggle{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}
.switch{width:50px;height:30px;border-radius:999px;border:none;background:var(--line);position:relative}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
.switch.on{background:var(--accent)} .switch.on::after{left:23px}
.actions{display:flex;gap:8px;margin-top:14px}
.actions .btn{flex:1}
textarea,.field{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;margin:4px 0 10px}
.seg{display:flex;background:var(--surface2);border-radius:10px;padding:3px;gap:3px;margin:4px 0 10px}
.seg button{flex:1;border:none;background:none;border-radius:8px;padding:8px}
.seg button.on{background:var(--surface);font-weight:600}

/* 운동 모드 */
.run{position:fixed;inset:0;background:var(--bg);z-index:40;display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.run-in{max-width:520px;width:100%;margin:0 auto;display:flex;flex-direction:column;flex:1;min-height:0}
.run-top{display:flex;align-items:center;gap:10px}
.bar{flex:1;height:6px;background:var(--surface2);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.run-body{flex:1;display:flex;flex-direction:column;justify-content:center;gap:10px;min-height:0;overflow:auto}
.run .fig-wrap{max-width:320px;width:100%;margin:0 auto}
.run h2{text-align:center;margin:0;font-size:24px}
.target{text-align:center;font-size:18px;font-weight:600}
.last{text-align:center;color:var(--muted);font-size:14px}
.adjust{display:flex;justify-content:center;gap:18px}
.adjust .one{display:flex;flex-direction:column;align-items:center;gap:4px}
.adjust .one .ctl{display:flex;align-items:center;gap:6px}
.adjust .one button{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:18px}
.adjust .one b{min-width:44px;text-align:center;font-size:20px}
.big-num{text-align:center;font-size:72px;font-weight:800;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.run-nav{display:flex;justify-content:space-between;margin-top:8px}
.run-nav button{border:none;background:none;color:var(--muted);padding:8px}
.next-prev{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.next-prev .thumb{width:64px;flex:none}
.run-top .spk{display:grid;place-items:center;color:var(--ink)}
.blocktag{align-self:center;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:12px;border-radius:999px;padding:3px 10px}
.linkbtn{border:none;background:none;color:var(--accent);font-weight:600;padding:4px 0;font-size:14px}
.badges{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
.badge{display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);border-radius:12px;padding:8px 10px;opacity:.55}
.badge.got{opacity:1;border-color:var(--accent);background:var(--accent-soft)}
.badge .medal{color:var(--accent);font-size:18px;line-height:1}
.note.backup{margin:10px 0 0;font-size:13px}
.promise li{margin:3px 0}
.onboard .run-in{gap:6px}
.onboard .brand{font-size:18px}
.form .field{margin:2px 0 2px}
.err{color:#c0392b;font-size:12px;min-height:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.photo{margin-bottom:12px}
.photo img{width:100%;height:auto;border-radius:10px;border:1px solid var(--line);margin-top:4px}
.ivtag{font-size:14px;padding:5px 14px}
.ivtag.run{background:var(--accent);color:var(--accent-ink)}
.sugline{text-align:center;font-size:13px;color:var(--muted)}
.sugline.up{color:var(--ok);font-weight:600}
.feel{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
.nextgoal b.up{color:var(--ok)}
.sum li{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
.sum{list-style:none;padding:0;margin:8px 0}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;max-width:90vw;text-align:center}
@media (min-width:520px){ .grid{grid-template-columns:repeat(3,1fr)} }
</style>

<style>
html{-webkit-text-size-adjust:100%}
.app{padding-top:calc(16px + env(safe-area-inset-top,0px))}
.install{background:var(--surface);border:1.5px dashed var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:14px;margin-bottom:14px}
.install p{margin:0;flex:1 1 220px}
.install button{border:none;border-radius:10px;padding:8px 14px;background:var(--accent);color:var(--accent-ink);font-weight:600}
.install button.plain{background:none;color:var(--muted)}

</style>

<body>

<script>
(function () {
'use strict';
/* ---------- 기본 도구 ---------- */
const $ = s => document.querySelector(s);
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'text') e.textContent = v;
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) e.append(c.nodeType ? c : String(c));
  return e;
}
const clear = e => { while (e.firstChild) e.removeChild(e.firstChild); return e; };
const DAYS = Logic.DAYS;
const DAY_KO = { mon: '월', tue: '화', wed: '수', thu: '목', fri: '금', sat: '토', sun: '일' };
const LV = ['', '쉬움', '보통', '어려움'];
const todayYmd = () => Logic.ymd(new Date());

let S = Logic.ensureRoutines(Logic.loadState(Logic.readStorage()));
let warned = false;
function save() {
  Logic.syncRoutine(S);
  if (!Logic.saveState(S) && !warned) { warned = true; toast('이 브라우저에서는 기록이 저장되지 않아요. 앱을 닫으면 사라질 수 있어요.'); }
}
let toastTimer = 0;
function toast(msg) {
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = h('div', { class: 'toast', role: 'status', text: msg });
  document.body.append(t);
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), 3200);
}

/* ---------- 운동 찾기 ---------- */
const BYID = {};
for (const e of EXERCISES) BYID[e.id] = e;
function lookup(id) {
  if (BYID[id]) return BYID[id];
  const c = S.custom.find(x => x.id === id);
  return c ? Object.assign({ part: '기타', equip: '맨몸', level: 0, custom: true, defaults: c.type === 'time' ? { sets: 3, sec: 30, rest: S.settings.restSec } : { sets: 3, reps: 10, rest: S.settings.restSec } }, c) : null;
}
const secLabel = s => (s >= 60 && s % 60 === 0 ? s / 60 + '분' : s + '초');
function amountText(it) { return it.mode === 'amrap' ? secLabel(it.sec) + ' 최대한' : it.type === 'time' ? it.sec + '초' : it.reps + '회'; }
function itemText(it) {
  return it.sets + '세트 × ' + amountText(it) + (it.kg ? ' · ' + it.kg + 'kg' : '') + ' · 쉬기 ' + it.rest + '초';
}
function newItem(ex) {
  const d = ex.defaults || {};
  const it = { exId: ex.id, name: ex.name, type: ex.type || 'reps', sets: d.sets || 3, rest: d.rest || S.settings.restSec };
  if (it.type === 'time') it.sec = d.sec || 30; else it.reps = d.reps || 10;
  if (it.type === 'reps' && S.settings.mode === 'amrap') { it.mode = 'amrap'; it.sec = 45; }
  if (d.kg) it.kg = d.kg;
  return it;
}
function estMin(items) {
  let s = 0;
  for (const it of items) s += it.sets * ((it.type === 'time' || it.mode === 'amrap' ? it.sec : it.reps * 3) + it.rest);
  return Math.max(1, Math.round(s / 60));
}

/* ---------- 탭 ---------- */
let tab = 'today';
function go(t) {
  tab = t;
  document.querySelectorAll('section[data-tab]').forEach(s => s.classList.toggle('on', s.dataset.tab === t));
  document.querySelectorAll('nav.tabs button').forEach(b => b.classList.toggle('on', b.dataset.go === t));
  if (t !== 'lib' && picking) { picking = null; }
  render();
  window.scrollTo(0, 0);
}
document.querySelectorAll('nav.tabs button').forEach(b => b.addEventListener('click', () => go(b.dataset.go)));
$('#gear').addEventListener('click', openSettings);
function render() {
  if (tab === 'today') renderToday();
  if (tab === 'plan') renderPlan();
  if (tab === 'lib') renderLib();
  if (tab === 'log') renderLog();
}

/* ---------- 시트 ---------- */
let sheetStops = [];
function openSheet(title, build) {
  closeSheet();
  const body = h('div');
  const sh = h('div', { class: 'sheet', role: 'dialog', 'aria-modal': 'true', 'aria-label': title },
    h('div', { class: 'grab' }),
    h('div', { class: 'sheet-head' }, h('h2', { text: title }), h('button', { class: 'close', 'aria-label': '닫기', onclick: closeSheet, text: '×' })),
    body);
  const bd = h('div', { class: 'backdrop', onclick: e => { if (e.target === bd) closeSheet(); } }, sh);
  document.body.append(bd);
  build(body);
  return body;
}
function ask(title, msg, okLabel, onOk, danger) {
  openSheet(title, body => {
    body.append(h('p', { class: 'muted', style: 'margin:0 0 4px', text: msg }));
    body.append(h('div', { class: 'actions' },
      h('button', { class: 'btn ghost', onclick: closeSheet, text: '취소' }),
      h('button', { class: danger ? 'btn danger' : 'btn primary', onclick: () => { closeSheet(); onOk(); }, text: okLabel })));
  });
}
function closeSheet() {
  sheetStops.forEach(f => f()); sheetStops = [];
  document.querySelectorAll('.backdrop').forEach(b => b.remove());
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

function stepper(label, value, step, min, max, onChange, opts) {
  opts = opts || {};
  const inp = h('input', { type: 'number', inputmode: 'numeric', value: value == null ? '' : value, placeholder: opts.placeholder || '', 'aria-label': label });
  const set = v => {
    if (v === '' && opts.allowEmpty) { inp.value = ''; onChange(null); return; }
    v = Math.min(max, Math.max(min, Math.round(Number(v) / step) * step || min));
    inp.value = v; onChange(v);
  };
  inp.addEventListener('change', () => set(inp.value));
  return h('div', { class: 'stepper' }, h('span', { text: label }),
    h('div', { class: 'ctl' },
      h('button', { 'aria-label': label + ' 줄이기', onclick: () => set((Number(inp.value) || 0) - step), text: '−' }),
      inp,
      h('button', { 'aria-label': label + ' 늘리기', onclick: () => set((Number(inp.value) || 0) + step), text: '+' })));
}

/* ================= 오늘 ================= */
function renderToday() {
  const root = clear($('#today'));
  const ymd = todayYmd(), dk = Logic.dayKey(ymd);
  const day = S.schedule[dk];
  const d = new Date();
  root.append(h('div', { class: 'today-date', text: (d.getMonth() + 1) + '월 ' + d.getDate() + '일 ' + DAY_KO[dk] + '요일' }));
  const doneToday = S.sessions.some(s => s.date === ymd);
  root.append(h('h2', { text: doneToday ? '오늘 운동 완료' : day.items.length ? '오늘의 운동' : '오늘은 쉬는 날' }));
  if (day.note) root.append(h('div', { class: 'note', text: day.note }));

  if (Logic.needBackup(S, Date.now())) root.append(h('div', { class: 'note backup' },
    h('div', { text: '운동 기록이 쌓였어요. 기록은 이 휴대폰 브라우저에만 있어서, 폰을 바꾸거나 데이터가 지워지면 사라질 수 있어요.' }),
    h('div', { class: 'row', style: 'margin-top:6px;gap:14px' },
      h('button', { class: 'linkbtn', onclick: openSettings, text: '지금 백업하기' }),
      h('button', { class: 'linkbtn', style: 'color:var(--muted)', onclick: () => { S.backup.snooze = Date.now() + 7 * 86400000; save(); render(); }, text: '일주일 뒤에' }))));
  const card = h('div', { class: 'card', style: 'margin-top:12px' });
  if (day.items.length) {
    card.append(h('div', { class: 'row muted small' }, h('span', { class: 'grow', text: '운동 ' + day.items.length + '개' }), h('span', { text: '약 ' + estMin(day.items) + '분' })));
    card.append(h('ul', { class: 'routine' }, day.items.map(it => h('li', {}, h('span', { text: it.name }), h('span', { class: 'muted small', text: it.sets + '×' + amountText(it) + (it.kg ? ' · ' + it.kg + 'kg' : '') })))));
    card.append(h('button', { class: 'btn primary big', onclick: () => startRun(day.items), text: doneToday ? '한 번 더 하기' : '시작' }));
    card.append(h('button', { class: 'btn ghost', style: 'width:100%;margin-top:8px', onclick: () => startRun(Logic.quickRoutine(day.items), { quick: true }), text: '10분만 하기 (운동 3개 × 2세트)' }));
  } else {
    const next = nextDay(dk);
    card.append(h('p', { class: 'muted', style: 'margin:0 0 12px', text: next ? '다음 운동은 ' + DAY_KO[next] + '요일이에요.' : '아직 시간표가 비어 있어요. 시간표에서 요일별 운동을 넣어 주세요.' }));
    if (!next) card.append(h('button', { class: 'btn primary big', onclick: openPlanner, text: '맞춤 루틴 만들기' }),
      h('button', { class: 'btn ghost', style: 'width:100%;margin-top:8px', onclick: () => go('plan'), text: '직접 짜기' }));
  }
  card.append(h('div', { class: 'actions' },
    h('button', { class: 'btn ghost', onclick: () => openCardioForm(), text: '+ 활동 기록' }),
    h('button', { class: 'btn ghost', onclick: openIntervalSetup, text: '러닝 타이머' })));
  if (DAYS.some(k => k !== dk && S.schedule[k].items.length)) card.append(h('button', { class: 'btn ghost', style: 'width:100%;margin-top:8px', onclick: pickOtherDay, text: '다른 요일 루틴으로 하기' }));
  root.append(card);

  // 이번 주
  const ws = Logic.weekStart(ymd);
  const dates = new Set(S.sessions.map(s => s.date));
  const week = h('div', { class: 'week' });
  DAYS.forEach((k, i) => {
    const dd = Logic.addDays(ws, i);
    week.append(h('div', { class: 'd' }, h('div', { class: 'dot' + (dates.has(dd) ? ' done' : '') + (dd === ymd ? ' today' : ''), 'aria-label': DAY_KO[k] + (dates.has(dd) ? ' 운동함' : '') }), DAY_KO[k]));
  });
  const g = goalNow(ymd);
  const resting = S.restWeeks.includes(ws);
  const restRow = resting
    ? h('div', { class: 'note', style: 'display:flex;align-items:center;gap:8px;margin-top:10px' }, h('span', { class: 'grow', text: '이번 주는 쉬어가는 주예요. 연속 기록이 끊기지 않아요.' }),
        h('button', { class: 'linkbtn', onclick: () => { S.restWeeks = S.restWeeks.filter(x => x !== ws); save(); render(); }, text: '취소' }))
    : (!g.met && Logic.canRest(S.restWeeks, ws)
      ? h('button', { class: 'linkbtn', style: 'margin-top:10px', onclick: () => ask('이번 주 쉬어가기', '아프거나 바쁜 주라면 쉬어가는 주로 표시하세요. 목표를 못 채워도 연속 기록이 끊기지 않아요. 한 달에 한 번만 쓸 수 있어요.', '쉬어가기', () => { S.restWeeks.push(ws); save(); render(); }), text: '이번 주 쉬어가기' })
      : null);
  root.append(h('h3', { text: '이번 주' }), h('div', { class: 'card' }, week, restRow,
    h('div', { class: 'stats' },
      h('div', { class: 'stat' }, h('span', { class: 'small muted', text: '이번 주' + (g.unit === 'kcal' ? ' (추정)' : '') }), h('b', { text: goalText(g) })),
      h('div', { class: 'stat' }, h('span', { class: 'small muted', text: '목표 달성 연속' }), h('b', { text: streakNow() + '주' }))),
    g.unit === 'kcal' && !weightNow() ? h('div', { class: 'small muted', style: 'margin-top:8px', text: '칼로리 목표는 프로필에 몸무게를 넣어야 계산돼요.' }) : null));
}
function nextDay(dk) {
  const i = DAYS.indexOf(dk);
  for (let k = 1; k <= 7; k++) { const d = DAYS[(i + k) % 7]; if (S.schedule[d].items.length) return d === dk ? null : d; }
  return null;
}
function pickOtherDay() {
  openSheet('어느 요일 루틴으로 할까요?', body => {
    for (const k of DAYS) {
      const it = S.schedule[k].items;
      if (!it.length) continue;
      body.append(h('button', { class: 'card', style: 'width:100%;text-align:left;margin-bottom:8px', onclick: () => { closeSheet(); startRun(it, { day: k }); } },
        h('b', { text: DAY_KO[k] + '요일' }), h('div', { class: 'small muted', text: it.map(x => x.name).join(', ') })));
    }
  });
}

/* ================= 시간표 ================= */
let planDay = Logic.dayKey(todayYmd());
function renderPlan() {
  const root = clear($('#plan'));
  root.append(h('h2', { text: '시간표' }), h('p', { class: 'muted small', style: 'margin:0 0 12px', text: '요일을 고르고 운동을 넣어 주세요.' }));
  const rsel = h('select', { class: 'field', style: 'margin:0', 'aria-label': '루틴 고르기' }, S.routines.map(r => { const o = h('option', { value: r.id, text: r.name }); if (r.id === S.activeRoutine) o.selected = true; return o; }));
  rsel.addEventListener('change', () => { S = Logic.switchRoutine(S, rsel.value); save(); toast('\'' + S.routines.find(r => r.id === S.activeRoutine).name + '\' 루틴으로 바꿨어요.'); render(); });
  root.append(h('div', { class: 'row', style: 'margin-bottom:10px' }, h('div', { class: 'grow' }, rsel),
    h('button', { class: 'iconbtn', 'aria-label': '루틴 관리', onclick: manageRoutines, text: '⋯' })));
  root.append(h('button', { class: 'planbtn', onclick: openPlanner, text: '맞춤 루틴 만들기' }));
  const tk = Logic.dayKey(todayYmd());
  root.append(h('div', { class: 'days' }, DAYS.map(k => h('button', { class: (k === planDay ? 'on' : '') + (k === tk ? ' today' : ''), onclick: () => { planDay = k; renderPlan(); } },
    h('b', { text: DAY_KO[k] }), h('small', { text: S.schedule[k].items.length ? S.schedule[k].items.length + '개' : '-' })))));
  const day = S.schedule[planDay];
  const note = h('input', { class: 'noteinput', placeholder: '메모 (예: 풋살 2시간)', value: day.note, maxlength: 60, 'aria-label': DAY_KO[planDay] + '요일 메모' });
  note.addEventListener('change', () => { day.note = note.value.trim(); save(); });
  root.append(note);
  const ul = h('ul', { class: 'items' });
  day.items.forEach((it, i) => {
    const thumb = h('div', { class: 'thumb', 'data-ex': it.exId });
    ul.append(h('li', { class: 'item' },
      thumb,
      h('button', { class: 'grow', style: 'border:none;background:none;text-align:left;padding:0', onclick: () => editItem(planDay, i) },
        h('div', { class: 'nm', text: it.name }), h('div', { class: 'small muted', text: itemText(it) })),
      h('div', { class: 'ctl' },
        h('button', { 'aria-label': '위로', disabled: i === 0, onclick: () => move(i, -1), text: '↑' }),
        h('button', { 'aria-label': '아래로', disabled: i === day.items.length - 1, onclick: () => move(i, 1), text: '↓' }),
        h('button', { 'aria-label': '삭제', onclick: () => { day.items.splice(i, 1); save(); renderPlan(); }, text: '✕' }))));
  });
  root.append(ul);
  if (!day.items.length) root.append(h('div', { class: 'empty', text: DAY_KO[planDay] + '요일은 비어 있어요.' }));
  root.append(h('button', { class: 'addbtn', onclick: () => pickExercise(planDay), text: '+ 운동 추가' }));
  if (day.items.length) root.append(h('p', { class: 'small muted', text: '예상 ' + estMin(day.items) + '분' }));
  observeThumbs(ul);
  function move(i, d) { const a = day.items; [a[i], a[i + d]] = [a[i + d], a[i]]; save(); renderPlan(); }
}
let thumbObs = [];
function observeThumbs(container) {
  thumbObs.forEach(o => o.disconnect()); thumbObs = [];
  thumbObs.push(Figure.observe(container, lookup));
}
function editItem(dk, i) {
  const it = S.schedule[dk].items[i];
  openSheet(it.name, body => {
    const ex = lookup(it.exId);
    if (ex && ex.poses) { const f = h('div', { class: 'detail-fig', style: 'max-width:220px' }); body.append(f); const m = Figure.mount(f, ex, {}); sheetStops.push(m.stop); }
    if (it.type !== 'time') {
      const seg = h('div', { class: 'seg', role: 'group', 'aria-label': '운동 방식' });
      [['reps', '횟수 정하기'], ['amrap', '시간 안에 최대한']].forEach(([v, t]) => seg.append(h('button', { class: (it.mode === 'amrap' ? 'amrap' : 'reps') === v ? 'on' : '', onclick: () => {
        if (v === 'amrap') { it.mode = 'amrap'; it.sec = it.sec || 45; } else { delete it.mode; delete it.sec; it.reps = it.reps || 10; }
        closeSheet(); editItem(dk, i);
      }, text: t })));
      body.append(h('div', { class: 'small muted', style: 'margin-top:8px', text: '운동 방식' }), seg);
    }
    body.append(stepper('세트', it.sets, 1, 1, 10, v => it.sets = v));
    if (it.type === 'time') body.append(stepper('시간(초)', it.sec, 5, 5, 600, v => it.sec = v));
    else if (it.mode === 'amrap') body.append(stepper('제한 시간(초)', it.sec, 15, 15, 180, v => it.sec = v));
    else body.append(stepper('반복(회)', it.reps, 1, 1, 100, v => it.reps = v));
    body.append(stepper('무게(kg)', it.kg == null ? null : it.kg, 1, 0, 100, v => { if (v) it.kg = v; else delete it.kg; }, { allowEmpty: true, placeholder: '없음' }));

const SVGNS = 'http://www.w3.org/2000/svg';
function sv(tag, attrs, parent) {
  const e = document.createElementNS(SVGNS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
const md = d => { const [, mm, dd] = d.split('-').map(Number); return mm + '/' + dd; };
const CW = 320, CH = 170, PADL = 30, PADR = 12, PADT = 22, PADB = 22;
function niceMax(v) { if (v <= 5) return 5; const p = Math.pow(10, Math.floor(Math.log10(v))); const n = v / p; return (n <= 2 ? 2 : n <= 5 ? 5 : 10) * p; }

function weekChart(host, readout) {
  const gt = S.settings.goalType || 'count', w8 = weightNow();
  const data = Logic.weeklySeries(S.sessions, todayYmd(), 8).map(d => { const st = Logic.weekStats(S.sessions, d.start, w8); return Object.assign(d, { minutes: st.minutes, kcal: st.kcal, v: gt === 'minutes' ? st.minutes : gt === 'kcal' ? st.kcal : d.days }); });
  const goal = goalNow().goal, gu = gt === 'minutes' ? '분' : gt === 'kcal' ? 'kcal' : '일';
  const ymax = gt === 'count' ? Math.max(7, goal) : niceMax(Math.max(goal, ...data.map(d => d.v)) * 1.1);
  const svg = sv('svg', { viewBox: '0 0 ' + CW + ' ' + CH, class: 'chart', role: 'img', 'aria-label': '최근 8주 주별 ' + (gt === 'minutes' ? '운동 시간' : gt === 'kcal' ? '소모 칼로리' : '운동한 날') });
  const plotW = CW - PADL - PADR, plotH = CH - PADT - PADB;
  const y = v => PADT + plotH - v / ymax * plotH;
  for (const t of [0, Math.ceil(ymax / 2), ymax]) {
    sv('line', { x1: PADL, x2: CW - PADR, y1: y(t), y2: y(t), class: 'grid' }, svg);
    const tl = sv('text', { x: PADL - 6, y: y(t) + 4, class: 'tick', 'text-anchor': 'end' }, svg); tl.textContent = t;
  }
  const bw = plotW / data.length, gap = 6;
  data.forEach((d, i) => {
    const x = PADL + i * bw + gap / 2, w = bw - gap, top = y(d.v), hgt = Math.max(0, y(0) - top);
    const met = d.v >= goal;

function lineChart(host, readout, series, unit, title, latest) {

  const svg = sv('svg', { viewBox: '0 0 ' + CW + ' ' + CH, class: 'chart', role: 'img', 'aria-label': title });
  const plotW = CW - PADL - PADR, plotH = CH - PADT - PADB;

  const x = d => series.length === 1 ? PADL + plotW / 2 : PADL + (Logic.parse(d.date).getTime() - t0) / (t1 - t0) * plotW;

    sv('line', { x1: PADL, x2: CW - PADR, y1: y(t), y2: y(t), class: 'grid' }, svg);
    const tl = sv('text', { x: PADL - 6, y: y(t) + 4, class: 'tick', 'text-anchor': 'end' }, svg); tl.textContent = Math.round(t * 10) / 10;
  }

  const best = latest ? series[series.length - 1] : series.reduce((a, d) => (d.value >= a.value ? d : a), series[0]);
  const word = latest ? '지금 ' : '최고 ';
  const lab = d => md(d.date) + ' · ' + fmtV(d.value) + (d.kg ? ' (' + d.kg + 'kg)' : '');
  series.forEach(d => {
    const isBest = d === best;

    const hit = sv('circle', { cx: x(d), cy: y(d.value), r: 14, class: 'hit', tabindex: 0, 'aria-label': lab(d) }, svg);

  });
  const bl = sv('text', { x: Math.min(Math.max(x(best), PADL + 30), CW - PADR - 30), y: y(best.value) - 10, class: 'tick best-t', 'text-anchor': 'middle' }, svg);
  bl.textContent = word + fmtV(best.value);

  if (series.length > 1) { const z = sv('text', { x: CW - PADR, y: CH - 6, class: 'tick', 'text-anchor': 'end' }, svg); z.textContent = md(series[series.length - 1].date); }
  host.append(svg);
  readout.textContent = word + fmtV(best.value) + ' (' + md(best.date) + ')' + (series.length === 1 ? ' · 두 번 이상 기록하면 선으로 이어져요' : '');

const PHOTO_DB = 'homet-photos';
function idb() {
  return new Promise((ok, no) => {
    try { const r = indexedDB.open(PHOTO_DB, 1); r.onupgradeneeded = () => r.result.createObjectStore('photos', { keyPath: 'id' }); r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); }
    catch (e) { no(e); }
  });
}
async function photoPut(rec) { const db = await idb(); return new Promise((ok, no) => { const tx = db.transaction('photos', 'readwrite'); tx.objectStore('photos').put(rec); tx.oncomplete = ok; tx.onerror = () => no(tx.error); }); }

  if (!run.finished) { const s = Logic.endRun(run, Date.now()); if (s.items.length) S.sessions.push(s); run.finished = s; persist(); syncNow(); }
  const s = run.finished;
  if (runFig) runFig.stop(); runFig = null;

  const min = Math.max(1, Math.round((s.end - s.start) / 60000));
  body.append(h('h2', { text: '수고했어요' }), h('div', { class: 'stats' },
    h('div', { class: 'stat' }, h('span', { class: 'small muted', text: '시간' }), h('b', { text: min + '분' })),
    h('div', { class: 'stat' }, h('span', { class: 'small muted', text: '완료 세트' }), h('b', { text: sets + '세트' })),
    weightNow() ? h('div', { class: 'stat' }, h('span', { class: 'small muted', text: '소모 (추정)' }), h('b', { text: '약 ' + Math.round(Logic.sessionKcal(s, weightNow())) + 'kcal' })) : null,
    h('div', { class: 'stat' }, h('span', { class: 'small muted', text: '이번 주' }), h('b', { text: goalText(goalNow()) }))));
  body.append(h('ul', { class: 'sum' }, s.items.map(it => h('li', {}, h('span', { text: it.name }), h('span', { class: 'muted small', text: itemText2(it) })))));
  const fb = feelBox(); if (fb) body.append(fb);
  const nowB = Logic.badges(S.sessions, S.settings.weeklyGoal, todayYmd(), S.restWeeks).filter(b => b.date);
  const beforeB = new Set(Logic.badges(S.sessions.filter(x => x.id !== s.id), S.settings.weeklyGoal, todayYmd(), S.restWeeks).filter(b => b.date).map(b => b.id));
  const fresh = nowB.filter(b => !beforeB.has(b.id));

    const key = it.type === 'time' ? 'sec' : 'reps';
    const baseIt = Object.assign({}, it); baseIt[key] = it.base == null ? it[key] : it.base;
    const g = Logic.suggest(baseIt, S.sessions);
    const unit = it.type === 'time' ? '초' : '회';
    if (g.value !== it[key]) next.push(h('li', {}, h('span', { text: it.name }), h('b', { class: g.value > it[key] ? 'up' : '', text: it[key] + ' → ' + g.value + unit })));

}
let actx = null;
function beep() {
  if ('vibrate' in navigator) try { navigator.vibrate(200); } catch (e) { /* 무시 */ }
  if (!S.settings.sound || (S.settings.voice && canSpeak())) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    [0, 0.22].forEach(t => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(actx.destination);
      const at = actx.currentTime + t;
      g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(0.25, at + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, at + 0.15);

}
async function lockWake() {

}

/* ---------- 시작 ---------- */
go('today');
if (S.activeRun && (S.activeRun.finished || S.activeRun.phase === 'done' || !Array.isArray(S.activeRun.items) || !Array.isArray(S.activeRun.log))) {
  if (S.activeRun.phase === 'done' && !S.activeRun.finished && Array.isArray(S.activeRun.log)) saveRunAsSession(S.activeRun);
  S.activeRun = null; save();
}
function saveRunAsSession(r) {
  const s = Logic.endRun(r, Date.now());

}
if (S.activeRun) {
  const saved = S.activeRun;
  openSheet('진행 중인 운동이 있어요', body => {
    const d = saved.log.reduce((a, x) => a + (x.block ? 0 : x.sets.length), 0);
    body.append(h('p', { class: 'muted', text: Logic.ymd(new Date(saved.startedAt)) + ' 시작 · 완료 ' + d + '세트' }));
    body.append(h('div', { class: 'actions' },
      h('button', { class: 'btn ghost', onclick: () => { closeSheet(); if (d) { saveRunAsSession(saved); toast('한 데까지 저장했어요.'); } S.activeRun = null; save(); render(); }, text: d ? '저장하고 끝내기' : '버리기' }),
      h('button', { class: 'btn primary', onclick: () => { closeSheet(); run = saved; if (run.phase === 'done') { closeRun(); return; } openRun(); }, text: '이어서 하기' })));
  });
}
else if (!S.profile) openOnboarding(1);
window.__app = { get S() { return S; }, go, startRun, lookup, openOnboarding };
{ const st = syncState(); if (st.pendingDelete || st.pending || (S.profile && S.profile.consent && (!st.last || Logic.ymd(new Date(st.last)) !== todayYmd()))) setTimeout(syncNow, 1500); }
})();
</script>
<script>
/* 앱 설치 안내 + 오프라인 지원 */
(function(){
  const box = document.getElementById("install"), txt = document.getElementById("installText"), btn = document.getElementById("installBtn");
  const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
  let dismissed = false; try { dismissed = localStorage.getItem("homet:installDismissed") === "1"; } catch(e) {}
  const close = () => { box.hidden = true; try { localStorage.setItem("homet:installDismissed", "1"); } catch(e) {} };
  document.getElementById("installClose").onclick = close;
  if (!standalone && !dismissed) {
    const ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    const inApp = /KAKAOTALK|NAVER\(|Instagram|FBAN|FBAV|Line\//i.test(navigator.userAgent);
    if (inApp) { txt.textContent = ios ? "앱처럼 쓰려면 오른쪽 아래 메뉴에서 'Safari로 열기'를 누른 뒤, 공유 버튼에서 '홈 화면에 추가'를 골라 주세요." : "앱처럼 쓰려면 메뉴에서 '다른 브라우저로 열기'를 누른 뒤 설치해 주세요."; btn.hidden = true; box.hidden = false; }
